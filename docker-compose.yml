services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yii2-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
      - backend-runtime:/var/www/html/runtime
      - backend-assets:/var/www/html/web/assets
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  services:
    build:
      context: ./services/ancillary-service
      dockerfile: Dockerfile
    container_name: nodejs-ancillary-service
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./services/ancillary-service:/app
      - services-node-modules:/app/node_modules
    environment:
      NODE_ENV: development
      PORT: 4000
      HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: react19-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend
      - services
    networks:
      - app-network

  postgres:
    image: postgres:17
    container_name: postgres17-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - app-network

volumes:
  postgres-data:
  backend-vendor:
  backend-runtime:
  backend-assets:
  frontend-node-modules:
  services-node-modules:

networks:
  app-network:
    driver: bridge
